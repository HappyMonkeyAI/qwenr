[project]
name = "qwenr"
version = "0.0.1"
description = "OpenAI-compatible Token Plan router for OpenBot auto:<class> roles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "starlette>=0.41",
  "uvicorn>=0.32",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
qwenr = "qwenr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
